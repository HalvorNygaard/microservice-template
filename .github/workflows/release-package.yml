name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PACKAGE_VERSION: ${{ inputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore service packages
        run: dotnet restore MicroserviceTemplate.slnx --configfile NuGet.Config -p:NuGetAudit=false

      - name: Restore template test packages
        run: dotnet restore tests/TemplateValidation.Tests/TemplateValidation.Tests.csproj --configfile NuGet.Config -p:NuGetAudit=false

      - name: Check formatting
        run: dotnet format MicroserviceTemplate.slnx --verify-no-changes --no-restore

      - name: Build service
        run: dotnet build MicroserviceTemplate.slnx -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Build template tests
        run: dotnet build tests/TemplateValidation.Tests/TemplateValidation.Tests.csproj -c Release --no-restore -p:ContinuousIntegrationBuild=true

      - name: Run unit tests
        run: dotnet test --project tests/MicroserviceTemplate.UnitTests/MicroserviceTemplate.UnitTests.csproj -c Release --no-build --no-restore

      - name: Run integration tests
        run: dotnet test --project tests/MicroserviceTemplate.IntegrationTests/MicroserviceTemplate.IntegrationTests.csproj -c Release --no-build --no-restore

      - name: Verify migrations
        run: dotnet ef migrations has-pending-model-changes --project src/MicroserviceTemplate/MicroserviceTemplate.csproj --startup-project src/MicroserviceTemplate/MicroserviceTemplate.csproj --no-build --configuration Release

      - name: Verify publish
        run: dotnet publish src/MicroserviceTemplate/MicroserviceTemplate.csproj -c Release --no-build

      - name: Test template generation
        run: dotnet test --project tests/TemplateValidation.Tests/TemplateValidation.Tests.csproj -c Release --no-build --no-restore

      - name: Pack template
        run: dotnet pack -c Release template/microservice-template.Template.csproj -p:PackageVersion="$PACKAGE_VERSION"

      - name: Publish to GitHub Packages
        run: dotnet nuget push ".artifacts/package/release/ModernMicroservice.Template.${PACKAGE_VERSION}.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
