name: Release package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Package version to publish, for example 1.0.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      ConnectionStrings__postgresdb: Host=localhost;Port=5432;Database=migration_validation;Username=postgres;Password=development-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build MicroserviceTemplate.slnx -c Release

      - name: Test service
        run: dotnet test --solution MicroserviceTemplate.slnx -c Release --no-build

      - name: Verify migrations
        run: dotnet ef migrations has-pending-model-changes --project src/MicroserviceTemplate/MicroserviceTemplate.csproj --startup-project src/MicroserviceTemplate/MicroserviceTemplate.csproj --no-build --configuration Release

      - name: Verify publish
        run: dotnet publish src/MicroserviceTemplate/MicroserviceTemplate.csproj -c Release --no-build

      - name: Test template generation
        run: dotnet test --project tests/TemplateValidation.Tests/TemplateValidation.Tests.csproj -c Release

      - name: Pack template
        run: dotnet pack -c Release template/microservice-template.Template.csproj /p:PackageVersion=${{ inputs.version }}

      - name: Publish to GitHub Packages
        run: dotnet nuget push "template/bin/Release/ModernMicroservice.Template.${{ inputs.version }}.nupkg" --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" --api-key "${{ secrets.GITHUB_TOKEN }}" --skip-duplicate
